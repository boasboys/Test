name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: python -m pytest

  fixture-guard:
    # "Fixtures are sacred": any PR that modifies or deletes an existing golden
    # fixture (or a pricing snapshot / load-bearing module) fails this check and
    # needs explicit human sign-off via the 'fixture-change-approved' label.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject modifications to load-bearing files
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-only --diff-filter=MD "origin/${{ github.base_ref }}"...HEAD -- \
            'tests/fixtures/golden/**' 'pricing/*.yaml' \
            'src/tokenlens/pricing/engine.py' 'src/tokenlens/reconcile/tieout.py')
          if [ -n "$CHANGED" ] && ! echo '${{ toJSON(github.event.pull_request.labels.*.name) }}' | grep -q 'fixture-change-approved'; then
            echo "Load-bearing files modified without 'fixture-change-approved' label:"
            echo "$CHANGED"
            exit 1
          fi
          echo "OK"
