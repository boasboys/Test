[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenlens"
version = "0.0.1"
description = "Free, local-first analyzer for Claude Code spend: correct token accounting, cache forensics, task-type attribution, invoice reconciliation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# PyYAML: pricing snapshots are dated YAML files per docs/spec.md §3 — loaded
# exclusively via yaml.safe_load in src/tokenlens/pricing/engine.py.
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
tokenlens = "tokenlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
